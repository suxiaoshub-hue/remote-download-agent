<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>网吧远程下载</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#1d2940;background:#f4f6fb;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{border:1px solid #d8deea;border-radius:10px;background:#fff;color:#23324b;padding:10px 15px;cursor:pointer}button:hover{border-color:#4f76ed}button.primary{background:#4775ed;color:#fff;border-color:#4775ed}button:disabled{opacity:.45;cursor:default}input{border:1px solid #d8deea;border-radius:12px;background:#fff;padding:12px 15px;outline:0}input:focus{border-color:#4775ed;box-shadow:0 0 0 3px #4775ed22}header{background:#fff;border-bottom:1px solid #e4e8f1;padding:25px max(22px,calc((100% - 1060px)/2));display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;margin:0 0 4px}h2{font-size:18px;margin:0}.subtle{color:#8090a8;line-height:1.6}.error{max-width:1060px;margin:18px auto 0;background:#fff0ec;color:#a8402d;border:1px solid #ffcfc5;border-radius:10px;padding:12px 15px;white-space:pre-wrap}.main{max-width:1060px;margin:auto;padding:25px 22px 60px}.login{max-width:420px;margin:10vh auto;background:#fff;border:1px solid #e4e8f1;border-radius:16px;padding:28px}.login input{width:100%;margin:18px 0}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px}.toolbar input{flex:1}.summary{display:flex;align-items:center;justify-content:space-between;background:#eef3ff;border-radius:13px;padding:15px 18px;margin-bottom:18px;color:#516487}.summary strong{color:#3762db;font-size:22px}.cafe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}.cafe-card{background:#fff;border:1px solid #e2e7f0;border-radius:16px;padding:19px;cursor:pointer;transition:box-shadow .15s,border-color .15s}.cafe-card:hover{border-color:#9db4ff;box-shadow:0 8px 24px #2d4e9c18}.cafe-top,.detail-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.cafe-name{font-size:20px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state{border-radius:20px;padding:5px 10px;font-size:12px;white-space:nowrap}.state.online{color:#168255;background:#e3f7ec}.state.offline{color:#b36a17;background:#fff2dd}.cafe-status{font-size:25px;margin:18px 0 5px}.cafe-meta{color:#8190a6;line-height:1.8}.cafe-actions{display:flex;gap:8px;margin-top:15px}.cafe-actions button{flex:1}.empty{background:#fff;border:1px dashed #d8deea;border-radius:14px;padding:35px;text-align:center;color:#8290a4}.detail{display:none}.detail.active{display:block}.back{padding:7px 12px;margin-bottom:17px}.detail-head{background:#fff;border:1px solid #e2e7f0;border-radius:16px;padding:20px;margin-bottom:18px}.detail-name{font-size:23px;font-weight:650}.search-row{display:flex;gap:11px;margin-top:18px}.search-row input{flex:1}.hint{margin:15px 0;color:#8390a4}.game-results{display:grid;gap:12px}.game-row{background:#fff;border:1px solid #e2e7f0;border-radius:14px;padding:17px;display:flex;align-items:center;justify-content:space-between;gap:16px}.game-name{font-size:18px;font-weight:600}.game-meta{color:#8390a4;margin-top:7px;font-size:13px}.game-row .status{white-space:nowrap}.status{border-radius:20px;padding:6px 11px;font-size:13px}.status.installed,.status.completed{color:#17784c;background:#e4f7ed}.status.not_installed,.status.missing{color:#4767bf;background:#e9efff}.status.pending,.status.downloading,.status.unknown{color:#a46b14;background:#fff3dc}.tasks{margin-top:22px}.task-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e2e7f0;border-radius:12px;padding:13px 16px;margin-top:9px}.task-meta{color:#8190a6;font-size:13px;margin-top:4px}.disk-note{color:#71809a;font-size:13px;margin-top:5px}.disk-bar{height:8px;background:#e9edf5;border-radius:5px;overflow:hidden;margin-top:9px}.disk-bar span{display:block;height:100%;background:#527bf0}.dialog{border:0;border-radius:16px;padding:25px;width:min(430px,90vw);box-shadow:0 12px 50px #192f5a33}.dialog::backdrop{background:#17284866}.dialog label{display:block;margin:16px 0 7px;color:#64738c}.dialog input{width:100%}.dialog .row{display:flex;gap:10px;margin-top:20px}.row{display:flex;align-items:center;gap:10px}@media(max-width:650px){header{padding:20px 16px}.main{padding:20px 16px}.toolbar,.search-row{flex-wrap:wrap}.toolbar input,.search-row input{flex-basis:100%}.game-row{align-items:flex-start;flex-direction:column}.game-row button{width:100%}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div><h1>网吧远程下载</h1><div class="subtle">选择网吧后搜索游戏</div></div><button id="logout" hidden>退出登录</button></header>
<main class="main">
<div id="error" class="error" role="alert" hidden></div>
<section id="login" class="login"><h2>登录管理后台</h2><p class="subtle">输入服务端 server-config.json 中的 adminToken。</p><form id="login-form"><input id="token" type="password" placeholder="后台登录密钥" required><button class="primary" type="submit">进入后台</button></form></section>
<section id="app" hidden>
  <div id="dashboard">
    <div class="toolbar"><input id="cafe-search" placeholder="搜索网吧名称"><button id="add">添加网吧</button><button id="refresh">刷新</button></div>
    <div class="summary"><span>在线 / 全部网吧</span><strong id="cafe-count">0/0</strong></div>
    <div id="cafes" class="cafe-grid"></div>
  </div>
  <div id="detail" class="detail">
    <button id="back" class="back">← 返回网吧列表</button>
    <div class="detail-head"><div class="detail-top"><div><div id="detail-name" class="detail-name"></div><div id="detail-meta" class="subtle"></div></div><button id="rename">修改名称</button></div><div class="search-row"><input id="game-search" placeholder="搜索游戏名称或 GID，例如 Roblox / 5131"><button id="game-search-button" class="primary">搜索</button></div><div id="disk-note" class="disk-note"></div></div>
    <div id="game-hint" class="hint">输入游戏名称或 GID 后搜索，只显示匹配游戏的下载状态。</div>
    <div id="game-results" class="game-results"></div>
    <div class="tasks"><h2>下载任务</h2><div id="tasks"></div></div>
  </div>
</section>
<dialog id="add-dialog" class="dialog"><form id="add-form"><h2>添加网吧</h2><label for="new-name">网吧名称</label><input id="new-name" placeholder="例如：中心店" required maxlength="100"><label for="server-url">Agent 连接的服务器地址</label><input id="server-url" type="url" required><p class="subtle">本机测试使用 http://127.0.0.1:8765；Linux 云服务器填写 HTTPS 域名。</p><div class="row"><button class="primary" type="submit">添加并下载配置</button><button id="close-add" type="button">取消</button></div></form></dialog>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const labels={installed:'已下载',not_installed:'未下载',missing:'未下载（目录缺失）',pending:'排队或暂停',unknown:'未确认',queued:'等待下发',delivering:'交给 Agent 中',accepted:'已接收',waiting:'已加入 PCStory',downloading:'已启动下载',failed:'命令失败',uncertain:'待确认',completed:'已完成',cancelled:'已取消'};
let token='',state={cafes:[],tasks:[]},selectedCafeId='',detailView=null,overview=null,detailRequest=0,polling=false,searchTimer=0,lastStateSignature='',resultsSignature='',sessionRevision=0;
function error(message=''){ $('error').textContent=message; $('error').hidden=!message; }
function bytes(value){if(!Number.isFinite(value))return'未知';const units=['B','KB','MB','GB','TB'];let i=0;while(value>=1024&&i<4){value/=1024;i++;}return value.toFixed(i?1:0)+' '+units[i];}
function time(value){return value?new Date(value*1000).toLocaleString('zh-CN'):'尚未上报';}
function statusNode(value){const node=document.createElement('span');node.className='status '+value;node.textContent=labels[value]||'未确认';return node;}
function cafeById(id){return state.cafes.find(cafe=>cafe.id===id);}
async function api(path,payload){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);try{const response=await fetch(path,{method:payload===undefined?'GET':'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:payload===undefined?undefined:JSON.stringify(payload),signal:controller.signal});let data={};try{data=await response.json();}catch(_error){}if(!response.ok)throw new Error(data.error||'请求失败');return data;}finally{clearTimeout(timeout);}}
function renderCafeHeader(){const cafe=cafeById(selectedCafeId);if(!cafe){$('detail-name').textContent='';return;}$('detail-name').textContent=cafe.name;$('detail-meta').textContent=(cafe.online?'在线':'离线')+(cafe.error?' · '+cafe.error:'')+' · 最近心跳 '+time(cafe.lastSeen);$('rename').disabled=false;}
function renderCafes(){const query=$('cafe-search').value.trim().toLocaleLowerCase();const cafes=state.cafes.filter(cafe=>!query||cafe.name.toLocaleLowerCase().includes(query));const online=state.cafes.filter(cafe=>cafe.online).length;$('cafe-count').textContent=online+'/'+state.cafes.length;const body=$('cafes');body.replaceChildren();if(!cafes.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=state.cafes.length?'没有匹配的网吧':'还没有网吧，点击“添加网吧”开始';body.append(empty);return;}for(const cafe of cafes){const card=document.createElement('article');card.className='cafe-card';card.dataset.cafeId=cafe.id;card.tabIndex=0;card.innerHTML='<div class="cafe-top"><div class="cafe-name"></div><span class="state"></span></div><div class="cafe-status"></div><div class="cafe-meta"></div><div class="cafe-actions"><button class="open">进入网吧</button><button class="rename-card">改名</button></div>';card.querySelector('.cafe-name').textContent=cafe.name;const stateNode=card.querySelector('.state');stateNode.textContent=cafe.online?'在线':'离线';stateNode.className='state '+(cafe.online?'online':'offline');card.querySelector('.cafe-status').textContent=cafe.error?'清单读取异常':'可搜索游戏';card.querySelector('.cafe-meta').textContent=cafe.error||('最近心跳：'+time(cafe.lastSeen));card.addEventListener('click',event=>{if(event.target.closest('button.rename-card')){renameCafe(cafe.id);return;}openCafe(cafe.id);});body.append(card);}}
function renderTasks(){const body=$('tasks');body.replaceChildren();const tasks=state.tasks.filter(task=>task.cafeId===selectedCafeId).sort((a,b)=>b.updatedAt-a.updatedAt);if(!tasks.length){const hint=document.createElement('div');hint.className='hint';hint.textContent='暂无任务';body.append(hint);return;}for(const task of tasks){const row=document.createElement('div');row.className='task-row';const info=document.createElement('div');const name=document.createElement('div');name.textContent=task.name+' / GID '+task.gameId;const meta=document.createElement('div');meta.className='task-meta';meta.textContent=time(task.updatedAt);info.append(name,meta);row.append(info,statusNode(task.status));body.append(row);}}
function renderDisk(){const source=overview||detailView;const disk=source&&source.disks&&source.disks.find(item=>item.downloadDisk);if(!disk){$('disk-note').textContent='PCStory 下载盘容量等待 Agent 上报';return;}$('disk-note').textContent='下载盘 '+disk.path+'：'+bytes(disk.freeBytes)+' 可用 / '+bytes(disk.totalBytes);}
function renderResults(){renderCafeHeader();renderDisk();const body=$('game-results'),query=$('game-search').value.trim();if(!detailView||!query){body.replaceChildren();resultsSignature='';$('game-hint').textContent='输入游戏名称或 GID 后搜索，只显示匹配游戏的下载状态。';return;}const games=detailView.games||[],cafeId=selectedCafeId,activeIds=state.tasks.filter(task=>task.cafeId===cafeId&&['queued','delivering','accepted','waiting','downloading','uncertain'].includes(task.status)).map(task=>task.gameId);$('game-hint').textContent=detailView.fresh?'搜索结果：'+games.length+' 个':'清单已失效，只显示最近结果，等待 Agent 恢复在线。';const signature=JSON.stringify([cafeId,query,detailView.fresh,games,activeIds]);if(signature===resultsSignature)return;resultsSignature=signature;body.replaceChildren();if(!games.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有找到匹配的游戏';body.append(empty);return;}for(const game of games){const row=document.createElement('div');row.className='game-row';const info=document.createElement('div');const name=document.createElement('div');name.className='game-name';name.textContent=game.name;const meta=document.createElement('div');meta.className='game-meta';meta.textContent='GID '+game.gameId+(game.sizeBytes?' · '+bytes(game.sizeBytes):'');info.append(name,meta);const action=document.createElement('div');action.className='row';action.append(statusNode(game.status));const button=document.createElement('button');button.className='primary';button.textContent='下发下载';button.disabled=!detailView.fresh||!['not_installed','missing'].includes(game.status)||activeIds.includes(game.gameId);button.onclick=()=>{if(selectedCafeId===cafeId)createTask(game.gameId,cafeId);};action.append(button);row.append(info,action);body.append(row);}}
async function loadDetail(){if(!selectedCafeId||!$('game-search').value.trim())return;const query=$('game-search').value.trim(),request=++detailRequest,session=sessionRevision;try{const next=await api('/api/cafes/'+encodeURIComponent(selectedCafeId)+'/inventory?query='+encodeURIComponent(query));if(session!==sessionRevision||request!==detailRequest||selectedCafeId!==next.cafeId||query!==$('game-search').value.trim())return;detailView=next;renderResults();}catch(err){if(session===sessionRevision&&request===detailRequest){error(err.message);if(detailView){detailView.fresh=false;renderResults();}}}}
async function loadOverview(){const cafeId=selectedCafeId,session=sessionRevision;if(!cafeId)return;try{const next=await api('/api/cafes/'+cafeId+'/overview');if(session!==sessionRevision||selectedCafeId!==cafeId)return;overview=next;renderDisk();}catch(err){if(session===sessionRevision&&selectedCafeId===cafeId)error(err.message);}}
async function refreshState(){if(!token||polling)return;const session=sessionRevision;polling=true;try{const next=await api('/api/state');if(!token||session!==sessionRevision)return;const signature=JSON.stringify(next.cafes.map(cafe=>[cafe.id,cafe.name,cafe.online,cafe.error]));state=next;if(signature!==lastStateSignature){lastStateSignature=signature;renderCafes();}if(selectedCafeId){renderCafeHeader();renderTasks();await loadOverview();if(session===sessionRevision&&$('game-search').value.trim())await loadDetail();}}catch(err){if(session!==sessionRevision)return;error(err.message);if(detailView){detailView.fresh=false;renderResults();}}finally{if(session===sessionRevision)polling=false;}}
function openCafe(id){detailRequest++;selectedCafeId=id;detailView=null;overview=null;resultsSignature='';$('dashboard').hidden=true;$('detail').classList.add('active');$('game-search').value='';renderResults();renderTasks();loadOverview();}
function back(){detailRequest++;selectedCafeId='';detailView=null;overview=null;$('detail').classList.remove('active');$('dashboard').hidden=false;renderCafes();}
async function renameCafe(id){const cafe=cafeById(id);const name=prompt('输入新的网吧名称',cafe.name);if(name&&name.trim())try{await api('/api/cafes/'+id+'/rename',{name:name.trim()});await refreshState();renderCafeHeader();}catch(err){error(err.message);}}
async function createTask(gameId,cafeId){try{error();await api('/api/tasks',{cafeId,gameId});await refreshState();}catch(err){error(err.message);}}
$('login-form').onsubmit=async event=>{event.preventDefault();token=$('token').value.trim();try{await api('/api/state');$('token').value='';$('login').hidden=true;$('app').hidden=false;$('logout').hidden=false;error();await refreshState();}catch(err){token='';error(err.message);}};
$('logout').onclick=()=>{sessionRevision++;detailRequest++;token='';state={cafes:[],tasks:[]};lastStateSignature='';resultsSignature='';polling=false;clearTimeout(searchTimer);$('game-search').value='';back();renderResults();renderTasks();$('app').hidden=true;$('logout').hidden=true;$('login').hidden=false;error();};
$('refresh').onclick=()=>{error();refreshState()};$('cafe-search').oninput=renderCafes;$('back').onclick=back;$('rename').onclick=()=>renameCafe(selectedCafeId);$('game-search-button').onclick=loadDetail;$('game-search').oninput=()=>{detailRequest++;clearTimeout(searchTimer);if(!$('game-search').value.trim()){detailView=null;renderResults();return;}searchTimer=setTimeout(loadDetail,260)};$('game-search').onkeydown=event=>{if(event.key==='Enter')loadDetail()};
$('add').onclick=()=>{$('server-url').value=location.origin;$('add-dialog').showModal()};$('close-add').onclick=()=>$('add-dialog').close();
$('add-form').onsubmit=async event=>{event.preventDefault();try{const result=await api('/api/cafes',{name:$('new-name').value,server:$('server-url').value.replace(/\/$/,'')});const link=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(result.config,null,2)],{type:'application/json'}));link.href=url;link.download='agent-config.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('add-dialog').close();$('new-name').value='';await refreshState();openCafe(result.id);}catch(err){$('add-dialog').close();error(err.message);}};
setInterval(refreshState,5000);
</script>
</body>
</html>
