name: Build Windows Agent

on:
  workflow_dispatch:
  push:
    paths:
      - 'prototype/**'
      - 'adapter/**'
      - '.github/workflows/build-agent.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Build Agent.exe
        run: |
          python -m pip install "pyinstaller==5.13.2" "cryptography==42.0.8" -r prototype/requirements-server.txt
          python -m unittest discover -s prototype -p "test*.py"
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
          python prototype/windows-console-test.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows console tests failed' }
          python -m PyInstaller --onefile --name Agent prototype/run_agent_config.py
          python -m PyInstaller --onefile --name Server --add-data "prototype/web.html;." prototype/server.py
      - name: Verify frozen programs
        run: python prototype/windows-smoke.py
      - name: Build PCStory adapter
        run: |
          cmake -S adapter -B build/adapter -A x64
          cmake --build build/adapter --config Release
          python adapter/tests/imports.py build/adapter/Release/PcstoryAdapter.exe
          if ($LASTEXITCODE -ne 0) { throw 'Import audit failed' }
          ./build/adapter/Release/PcstoryStatusTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native status tests failed' }
          ./adapter/tests/windows.ps1 -Bin build/adapter/Release
          if ($LASTEXITCODE -ne 0) { throw 'Native IPC tests failed' }
          python prototype/windows-progress-test.py build/adapter/Release/PcstoryProgressFixture.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native progress sampling tests failed' }
          python prototype/windows-controls-test.py build/adapter/Release/PcstoryProgressFixture.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native GID control tests failed' }
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/Agent.exe release/Agent.exe
          Copy-Item dist/Server.exe release/Server.exe
          Copy-Item build/adapter/Release/PcstoryAdapter.exe release/PcstoryAdapter.exe
          Copy-Item adapter/Start-Download.cmd, adapter/pcstory-adapter.ini release/
          Copy-Item prototype/agent-config.json.example release/agent-config.json.example
          Copy-Item prototype/Start-Agent.cmd, prototype/Start-Server.cmd, prototype/使用说明.txt release/
          Compress-Archive -Path release/* -DestinationPath remote-download-agent-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: remote-download-agent-windows
          path: remote-download-agent-windows.zip
