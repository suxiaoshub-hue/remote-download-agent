name: Build Windows Agent

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Build Agent.exe
        run: |
          python -m pip install "pyinstaller==5.13.2"
          python -m PyInstaller --onefile --name Agent prototype/run_agent_config.py
          python -m PyInstaller --onefile --name Server prototype/server.py
          python -m PyInstaller --onefile --name PcstoryProbe prototype/pcstory_probe.py
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/Agent.exe release/Agent.exe
          Copy-Item dist/Server.exe release/Server.exe
          Copy-Item dist/PcstoryProbe.exe release/PcstoryProbe.exe
          Copy-Item prototype/agent-config.json.example release/agent-config.json.example
          @'
          1. 双击 Server.exe，看到 server listening 后保持窗口运行
          2. 将 agent-config.json.example 改名为 agent-config.json 并填写配置
          3. 双击 Agent.exe
          4. 浏览器打开 http://127.0.0.1:8765/
          '@ | Set-Content release/使用说明.txt -Encoding UTF8
          Compress-Archive -Path release/* -DestinationPath remote-download-agent-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: remote-download-agent-windows
          path: remote-download-agent-windows.zip
