name: Build Windows Agent

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Build Agent.exe
        run: |
          python -m pip install "pyinstaller==5.13.2"
          python -m PyInstaller --onefile --name Agent prototype/agent.py
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/Agent.exe release/Agent.exe
          Copy-Item prototype/agent-config.json.example release/agent-config.json.example
          Compress-Archive -Path release/* -DestinationPath remote-download-agent-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: remote-download-agent-windows
          path: remote-download-agent-windows.zip
