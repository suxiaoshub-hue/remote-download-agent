name: Build Windows PCStory Debugger
on:
  workflow_dispatch:
  push:
    paths:
      - 'debugger/**'
      - '.github/workflows/build-debugger.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64
        run: cmake -S debugger -B build/debugger -A x64
      - name: Compile
        run: cmake --build build/debugger --config Release
      - name: Verify capture and detach
        shell: pwsh
        run: ./debugger/tests/smoke.ps1 -Bin build/debugger/Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-debugger | Out-Null
          Copy-Item build/debugger/Release/PcstoryDebugger.exe release-debugger/
          Copy-Item debugger/使用说明.txt release-debugger/
          Compress-Archive -Path release-debugger/* -DestinationPath PcstoryDebugger-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcstory-debugger-diagnostics
          path: ${{ runner.temp }}/pcstory-capture-smoke/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PcstoryDebugger-Windows-x64
          path: PcstoryDebugger-Windows-x64.zip
